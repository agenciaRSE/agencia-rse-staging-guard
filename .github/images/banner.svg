<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Agencia RSE Staging Guard</title>
  <desc id="d">WordPress plugin for staging copies: no indexing, no real analytics, no webhooks, optional email block.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14121f"/><stop offset="1" stop-color="#2a1d4a"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g transform="translate(72 72)">
    <rect width="108" height="34" rx="6" fill="#b32d2e"/>
    <text x="54" y="23" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" letter-spacing="1">STAGING</text>
  </g>
  <text x="72" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#hl)">Staging Guard</text>
  <text x="72" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#e5e7eb">Your WordPress test copy, out of Google and out of your analytics.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#d1d5db">
    <g transform="translate(72 262)"><rect width="128" height="36" rx="18" fill="#ffffff14" stroke="#ffffff33"/><text x="64" y="24" text-anchor="middle">noindex</text></g>
    <g transform="translate(212 262)"><rect width="196" height="36" rx="18" fill="#ffffff14" stroke="#ffffff33"/><text x="98" y="24" text-anchor="middle">no GA4 · GTM · Ads</text></g>
    <g transform="translate(420 262)"><rect width="132" height="36" rx="18" fill="#ffffff14" stroke="#ffffff33"/><text x="66" y="24" text-anchor="middle">no Meta pixel</text></g>
    <g transform="translate(564 262)"><rect width="200" height="36" rx="18" fill="#ffffff14" stroke="#ffffff33"/><text x="100" y="24" text-anchor="middle">no Woo webhooks</text></g>
    <g transform="translate(776 262)"><rect width="164" height="36" rx="18" fill="#ffffff14" stroke="#ffffff33"/><text x="82" y="24" text-anchor="middle">email: optional</text></g>
  </g>
  <text x="1128" y="320" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#9ca3af">by AGENCIA RSE · agenciarse.com</text>
</svg>
