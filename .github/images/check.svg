<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d">
  <title id="t">Checking a staging site with curl</title>
  <desc id="d">Real output from a staging copy with Staging Guard: X-Robots-Tag noindex nofollow header, robots meta tag and an HTML comment saying 3 tracking tags were removed.</desc>
  <rect width="1000" height="300" rx="14" fill="#0f1117"/>
  <rect width="1000" height="38" rx="14" fill="#1c1f2a"/><rect y="24" width="1000" height="14" fill="#1c1f2a"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f57"/><circle cx="44" cy="19" r="6" fill="#febc2e"/><circle cx="64" cy="19" r="6" fill="#28c840"/>
  <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="17">
    <text x="24" y="78" fill="#9ca3af">$ <tspan fill="#e5e7eb">curl -sI https://staging.example.com/ | grep -i x-robots</tspan></text>
    <text x="24" y="106" fill="#86efac">X-Robots-Tag: noindex, nofollow</text>
    <text x="24" y="150" fill="#9ca3af">$ <tspan fill="#e5e7eb">curl -s https://staging.example.com/ | grep -E "robots|staging-guard"</tspan></text>
    <text x="24" y="178" fill="#86efac">&lt;meta name='robots' content='noindex, nofollow' /&gt;</text>
    <text x="24" y="206" fill="#86efac">&lt;!-- agencia-rse-staging-guard 1.0.0: staging, 3 tracking tags removed --&gt;</text>
    <text x="24" y="250" fill="#9ca3af">$ <tspan fill="#e5e7eb">curl -s https://staging.example.com/ | grep -c googletagmanager</tspan></text>
    <text x="24" y="278" fill="#86efac">0</text>
  </g>
</svg>
